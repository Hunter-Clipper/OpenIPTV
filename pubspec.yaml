name: open_iptv
description: Open-source, ad-free, cross-platform IPTV client.
publish_to: none
version: 0.15.9+389

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Database
  drift: ^2.35.4
  path_provider: ^2.1.3

  # Navigation
  go_router: ^18.1.4

  # Networking
  http: ^1.2.1

  # XML (XMLTV parsing)
  xml: ^7.0.1

  # Images
  cached_network_image: ^4.0.3

  # Encryption (AES-256 for backup PIN)
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Archive (.iptvprofile ZIP)
  archive: ^4.7.1

  # Background audio
  audio_service: ^0.18.12

  # File operations
  file_picker: ^13.4.0
  share_plus: ^13.3.1
  path: ^1.9.0

  # App metadata
  package_info_plus: ^10.2.2

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  # Background auto-refresh
  workmanager: ^0.10.10
  flutter_local_notifications: ^23.0.2
  permission_handler: ^13.0.2
  # Registers the app's native channels on every engine (Android Auto).
  engine_hooks:
    path: packages/engine_hooks
  # SQLCipher-compatible API (opening/encrypting the database); also used
  # by DB tests to load the host's libsqlite3.
  sqlite3: ^3.5.2
  flutter_secure_storage: ^11.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.35.3
  riverpod_generator: ^4.0.10
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  # Brand artwork sources: assets/branding/ (see its README).
  image_path: "assets/branding/png/app_icon.png"
  adaptive_icon_background: "assets/branding/png/icon_background.png"
  adaptive_icon_foreground: "assets/branding/png/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/png/icon_monochrome.png"
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#0A0A12"
  image: assets/branding/png/splash_mark.png
  branding: assets/images/wordmark.png
  branding_bottom_padding: 48
  android: true
  ios: true
  android_12:
    color: "#0A0A12"
    image: assets/branding/png/splash_mark.png
    branding: assets/images/wordmark.png

flutter:
  uses-material-design: true
  generate: true

  # Google Sans (SIL OFL 1.1 — assets/fonts/google_sans/OFL.txt), subset to
  # Latin, Greek and Cyrillic; other scripts fall back to the system font.
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/google_sans/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/google_sans/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/google_sans/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/google_sans/GoogleSans-Bold.ttf
          weight: 700
    # Nunito (SIL OFL 1.1 — assets/fonts/nunito/OFL.txt): the Retro Cable look.
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
    # JetBrains Mono (SIL OFL 1.1 — assets/fonts/jetbrains_mono/OFL.txt): the
    # Terminal green and Amber looks.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700

  assets:
    - assets/images/

# SQLite is bundled by package:sqlite3's build hook; the SQLCipher build gives
# the encrypted database (replaces sqlcipher_flutter_libs, now end-of-life).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
