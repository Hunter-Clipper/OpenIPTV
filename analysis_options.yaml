include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Generated by gen-l10n, whose template still uses the deprecated
    # GlobalMaterialLocalizations / GlobalCupertinoLocalizations names.
    - lib/l10n/gen/**
    - build/**
    - android/**
    - ios/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_unnecessary_containers
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - sort_constructors_first
    - unawaited_futures
