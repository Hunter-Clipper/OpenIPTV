# Builds the desktop app (an Electron shell around the web client) for
# Windows and Linux, so it can be downloaded and tried on a real machine.
# Plan: docs/design/desktop.md. Unsigned test builds, not releases.
name: Desktop build

on:
  push:
    branches: [feature/27-windows-client]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      web_ref:
        description: Branch or tag of the web client to package
        default: feature/44-web-client

permissions:
  contents: read

env:
  # The web client lives on its own branch until PR #45 lands; then this
  # becomes main.
  WEB_REF: ${{ inputs.web_ref || 'feature/44-web-client' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, builder: --win }
          - { os: ubuntu-latest, name: linux, builder: --linux }
    steps:
      - name: Desktop shell
        uses: actions/checkout@v4

      - name: Web client
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WEB_REF }}
          path: web-src

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.3
          cache: true

      - name: Build the web app
        working-directory: web-src
        run: |
          flutter pub get
          flutter build web --release

      - name: Put the web app, icon and version into the shell
        shell: bash
        run: |
          rm -rf desktop/app && mkdir -p desktop/app desktop/build
          cp -r web-src/build/web/. desktop/app/
          cp web-src/web/icons/Icon-512.png desktop/build/icon.png
          version=$(grep '^version:' web-src/pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "App version: $version"
          cd desktop && npm pkg set version="$version"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Package
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder ${{ matrix.builder }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: OpenIPTV-${{ matrix.name }}
          path: |
            desktop/dist/OpenIPTV-windows.zip
            desktop/dist/OpenIPTV-windows-setup.exe
            desktop/dist/OpenIPTV-linux.AppImage
          if-no-files-found: error
          retention-days: 14
